services:
  vpn1:
    extends:
      file: docker-compose.base.yml
      service: vpn-template
    container_name: vpn1
    hostname: vpn1
    networks:
      - vpn1-net
      - docker-ovpn-vlan
    volumes:
      - ./configs/vpn1:/vpn:ro,z
      - ./shared:/shared:ro,z
      - ./logs:/logs:z
    environment:
      - CREDENTIALS=false

networks:
  docker-ovpn-vlan:
    external: true
