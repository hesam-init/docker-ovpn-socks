# ─────────────────────────────────────────────
# Logging presets
# ─────────────────────────────────────────────
x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "4m"
    max-file: "1"

services:
  vpn-template:
    build:
      context: ${PWD}
      dockerfile: Dockerfile
      target: vpn
      network: host
    image: vpn-client:latest
    logging: *logging-default
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
    environment:
      - TZ=Asia/Tehran
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  gost-template:
    build:
      context: ${PWD}
      dockerfile: Dockerfile
      target: gost
      network: host
    image: gost-proxy:latest
    logging: *logging-default
    restart: unless-stopped
    hostname: gost-proxy
    cap_add:
      - NET_ADMIN
    ports:
      - "1080-1100:1080-1100"
      - "18080:18080"
    environment:
      - TZ=Asia/Tehran
      - WEBAPI_PORT=18080
      - WEBAPI_USER=admin
      - WEBAPI_PASS=gost
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
