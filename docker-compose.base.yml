# ─────────────────────────────────────────────
# Logging presets
# ─────────────────────────────────────────────
x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "2m"
    max-file: "1"

x-logging-silent: &logging-silent
  driver: "none"

# ─────────────────────────────────────────────
# Process presets
# ─────────────────────────────────────────────
x-stop-fast: &stop-fast
  stop_signal: SIGKILL

x-stop: &stop
  stop_signal: SIGTERM
  stop_grace_period: 3s

services:
  vpn-template:
    <<: *stop-fast
    build:
      context: ${PWD}
      dockerfile: Dockerfile
      target: vpn
      network: host
    image: vpn-client:latest
    logging: *logging-default
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    dns:
      - 8.8.8.8
    environment:
      - TZ=Asia/Tehran
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "ip link show tun0 && curl -sf --max-time 5 https://1.1.1.1 > /dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
