name: docker-ovpn-socks

# vpnbaz preset: set VPN_CONFIG to a file name in configs/ovpn-vpnbaz.
# Each service sets its own ports.
x-vpnbaz: &vpnbaz
  extends:
    file: compose/docker-compose.base.yml
    service: ovpn-template
  volumes:
    - ./configs/ovpn-vpnbaz:/etc/openvpn:ro,z
    # - ./configs/shared/vpnbaz.auth:/etc/openvpn/auth.txt:ro,z

# openconnect preset: set VPN_SERVER; credentials come from configs/ovpn-vpnbaz/auth.txt.
# Each service sets its own ports.
x-openconnect: &openconnect
  extends:
    file: compose/docker-compose.base.yml
    service: openconnect-template
  volumes:
    - ./configs/ovpn-vpnbaz/auth.txt:/etc/openconnect/auth.txt:ro,z

services:
  vpnbaz-socks:
    <<: *vpnbaz
    ports: ["1080:1080"]
    environment: VPN_CONFIG=Smart3MTN.ovpn

  vpnbaz2-socks:
    <<: *vpnbaz
    ports: ["1081:1080"]
    environment: VPN_CONFIG=Smart9MTN-nl.ovpn

  vpnbaz3-socks:
    <<: *vpnbaz
    ports: ["1082:1080"]
    environment: VPN_CONFIG=Smart10MTN-nl.ovpn

  vpnbaz-openconnect-socks:
    <<: *openconnect
    ports: ["9090:1080"]
    environment: VPN_SERVER=mcipower1.apibaz.org

  vpnbaz2-openconnect-socks:
    <<: *openconnect
    ports: ["9091:1080"]
    environment: 
      - VPN_SERVER=mci6.apibaz.org
      - VPN_OS=android

  eliteping-socks:
    extends:
      file: compose/docker-compose.base.yml
      service: ovpn-template
    container_name: eliteping
    environment: VPN_CONFIG=/etc/openvpn/tcp-de1.e-mix.ir.ovpn
    ports: ["3080:1080"]
    volumes:
      - ./configs/ovpn-eliteping:/etc/openvpn:ro,z
      # - ./configs/shared/vpnbaz.auth:/etc/openvpn/auth.txt:ro,z