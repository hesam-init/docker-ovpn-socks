services:
  vpnbaz-socks:
    extends:
      file: docker-compose.base.yml
      service: ovpn-template
    container_name: vpnbaz
    environment:
      - VPN_CONFIG=/etc/openvpn/Smart3MTN.ovpn
    ports:
      - "1080:1080"
    volumes:
      - ./configs/ovpn-vpnbaz:/etc/openvpn:ro,z
      # - ./configs/shared/vpnbaz.auth:/etc/openvpn/auth.txt:ro,z

  eliteping-socks:
    extends:
      file: docker-compose.base.yml
      service: ovpn-template
    container_name: eliteping
    environment:
      - VPN_CONFIG=/etc/openvpn/tcp-de1.e-mix.ir.ovpn
    ports:
      - "3080:1080"
    volumes:
      - ./configs/ovpn-eliteping:/etc/openvpn:ro,z
      # - ./configs/shared/vpnbaz.auth:/etc/openvpn/auth.txt:ro,z

  tci-socks:
    extends:
      file: docker-compose.base.yml
      service: openconnect-template
    container_name: tci-socks
    environment:
      - VPN_SERVER=mcipower1.apibaz.org
      # - VPN_USER=username
      # - VPN_PASSWORD=password
    ports:
      - "9090:1080"
    volumes:
      - ./configs/ovpn-vpnbaz/auth.txt:/etc/openconnect/auth.txt:ro,z
